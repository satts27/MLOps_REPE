global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ["backend:5000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
