name: Nightly market ingestion

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install collector dependencies
        run: python -m pip install -r requirements-collector.txt

      - name: Collect nightly market data
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: mlops_repe
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python collect_market_data.py --profile nightly
