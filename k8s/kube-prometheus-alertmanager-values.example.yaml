# Copy to kube-prometheus-alertmanager-values.yaml (gitignored) and paste
# real SMTP values. Then:
# helm upgrade prometheus prometheus-community/kube-prometheus-stack \
#   --namespace monitoring --reuse-values \
#   --values k8s/kube-prometheus-alertmanager-values.yaml
alertmanager:
  config:
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: you@example.com
      smtp_auth_username: you@example.com
      smtp_auth_password: your_app_password
      smtp_require_tls: true
    route:
      receiver: email
      group_by: [alertname]
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
    receivers:
      - name: email
        email_configs:
          - to: you@example.com,other@example.com
            send_resolved: true
