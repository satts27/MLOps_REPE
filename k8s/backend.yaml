apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: mlops_repe-backend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: BACKEND_HOST
              value: "0.0.0.0"
            - name: BACKEND_PORT
              value: "5000"
            - name: FLASK_DEBUG
              value: "0"
          envFrom:
            - secretRef:
                name: mlops-repe-env
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true
            - name: outputs
              mountPath: /app/outputs
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
      volumes:
        - name: models
          emptyDir: {}
        - name: outputs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: http
