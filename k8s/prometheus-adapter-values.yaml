prometheus:
  url: http://prometheus-operated.monitoring.svc
  port: 9090

rules:
  default: false
  custom:
    - seriesQuery: 'backend_http_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: ^backend_http_requests_total$
        as: backend_http_requests_per_minute
      metricsQuery: 'sum(60 * rate(<<.Series>>{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)'
